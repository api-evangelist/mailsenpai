aid: mailsenpai
name: SMTP Senpai (MailSenpai)
image: https://en.mailsenpai.com/wp-content/uploads/2026/10/mailsenpai-og-en.jpg
description: 'MailSenpai is an Italian email service for businesses, operating since 2016 with servers and data hosted in the European Union.
  It offers two products: an email marketing platform for newsletters and campaigns, and SMTP Senpai, a transactional email relay service with
  REST API and SMTP access. The service supports Italian and English support, provides DKIM signing, SPF/DKIM/DMARC checks, and detailed sending
  logs. Plans are tiered with a free trial and pricing in euros, targeting B2B outreach and marketing automation.'
